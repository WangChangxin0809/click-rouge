<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Click Rouge — 点击肉鸽</title>
    <style>
        /* === Reset & Base === */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            color: #e0e0e0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* === Canvas Layer (z-index: 0) === */
        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* === Ambient Particle Background (z-index: 1) === */
        #bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .bg-particle {
            position: absolute; border-radius: 50%;
            animation: bgParticleFloat linear infinite;
            opacity: 0;
        }
        @keyframes bgParticleFloat {
            0%   { opacity: 0; transform: translateY(100vh) scale(0); }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.2; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        /* === Damage Layer (z-index: 5) === */
        #damage-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .dmg-float {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .dmg-float.active {
            animation: dmgFloatUp 0.8s ease-out forwards;
        }

        @keyframes dmgFloatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(1);
            }
            60% {
                opacity: 0.6;
                transform: translate(-50%, -50%) translateY(-24px) scale(1.05);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-40px) scale(0.9);
            }
        }

        /* Normal damage: white with slight yellow tint */
        .dmg-number.dmg-normal {
            font-size: 22px;
            color: #f5f0d0;
        }

        /* Critical hit: orange/red, larger, with scale pulse */
        .dmg-number.dmg-crit {
            font-size: 32px;
            color: #ff8c42;
            text-shadow:
                0 0 8px rgba(255, 140, 66, 0.7),
                0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .dmg-number.dmg-crit.active {
            animation: dmgCritFloat 0.8s ease-out forwards;
        }

        @keyframes dmgCritFloat {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(0.7);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(-8px) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-40px) scale(1.0);
            }
        }

        /* Gold popup: golden color */
        .dmg-number.dmg-gold {
            font-size: 20px;
            color: #ffd700;
            text-shadow:
                0 0 6px rgba(255, 215, 0, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Miss text: grey, small, italic */
        .dmg-number.dmg-miss {
            font-size: 16px;
            color: #8888a0;
            font-style: italic;
            letter-spacing: 2px;
        }

        /* === HUD Overlay Layer (z-index: 10) === */
        #hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Top HUD bar */
        .hud-top {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(5, 5, 15, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 16px;
        }

        .hud-hp {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .hud-hp-label {
            color: #e94560;
            font-weight: bold;
            white-space: nowrap;
        }

        .hud-hp-bar-outer {
            flex: 1;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            min-width: 60px;
        }

        .hud-hp-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e94560, #c23152);
            border-radius: 7px;
            transition: width 0.25s ease;
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            font-size: 14px;
        }

        .hud-stat .icon {
            font-size: 16px;
        }

        .hud-stat .value {
            color: #f0c040;
            font-weight: bold;
        }

        .hud-pause-btn {
            background: none; border: 1px solid rgba(255,255,255,0.15);
            color: #e0e0e0; font-size: 18px; width: 32px; height: 32px;
            border-radius: 6px; cursor: pointer; pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1; transition: background 0.15s;
        }
        .hud-pause-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .hud-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Bottom skill bar */
        .skill-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(5, 5, 15, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 18px;
            pointer-events: auto;
        }

        .skill-slot {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            cursor: pointer;
            pointer-events: auto;
            overflow: hidden;
            position: relative;
        }

        .skill-slot:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.14);
        }

        .skill-slot:focus-visible {
            outline: 2px solid #f0c040;
            outline-offset: 2px;
        }

        /* Skill slot — filled state */
        .skill-slot-filled {
            border-color: rgba(78, 204, 163, 0.7);
            background: rgba(78, 204, 163, 0.12);
            box-shadow:
                0 0 14px rgba(78, 204, 163, 0.3),
                inset 0 0 10px rgba(78, 204, 163, 0.06);
        }

        /* Skill slot — empty state */
        .skill-slot-empty {
            border-style: dashed;
            opacity: 0.5;
        }

        .skill-slot .skill-icon {
            font-size: 22px;
            line-height: 1;
            z-index: 2;
            position: relative;
        }

        .skill-slot .skill-name {
            font-size: 9px;
            color: #b0b0c0;
            z-index: 2;
            position: relative;
            margin-top: 1px;
            max-width: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .skill-slot .key-hint {
            position: absolute;
            bottom: -18px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            z-index: 5;
        }

        .skill-slot[data-key] {
            position: relative;
        }

        /* Skill level badge — small tag in top-right corner of filled skill slot */
        .skill-level-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 9px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.75);
            padding: 1px 5px;
            border-radius: 3px;
            z-index: 5;
            line-height: 1.3;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        /* Skill level colors — Lv.1 white, Lv.2 blue, Lv.3 purple, Lv.4+ gold */
        .skill-level-1 { color: #e0e0e0; }
        .skill-level-2 { color: #5b9bd5; }
        .skill-level-3 { color: #b07ce0; }
        .skill-level-4 { color: #ffd700; }

        /* Cooldown overlay — fills from top to bottom */
        .skill-cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            z-index: 3;
            transition: height 0.1s linear;
            pointer-events: none;
            display: none;
        }

        .skill-slot-filled .skill-cooldown-overlay {
            /* Visible only when cooldownFraction > 0, set via JS */
        }

        /* === Equipment Panel (right side of HUD) === */
        .equipment-panel {
            position: absolute;
            top: 70px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 160px;
            pointer-events: none;
        }

        .equipment-panel-title {
            font-size: 11px;
            color: #8888a0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 2px;
        }

        .equip-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 12px;
            min-height: 28px;
            transition: background 0.2s;
        }

        .equip-row-empty {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .equip-row-filled {
            color: #e0e0e0;
            background: rgba(78, 204, 163, 0.1);
            border: 1px solid rgba(78, 204, 163, 0.2);
        }

        .equip-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .equip-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: bold;
        }

        .equip-stats {
            font-size: 10px;
            color: #f0c040;
            white-space: nowrap;
        }

        .equip-level {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Equipment level colors — same as unified level system */
        .equip-level-1 { color: #e0e0e0; }
        .equip-level-2 { color: #5b9bd5; }
        .equip-level-3 { color: #b07ce0; }
        .equip-level-4 { color: #ffd700; }

        /* === Modal Layer (z-index: 100) === */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .modal-card {
            background: rgba(22, 22, 38, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            pointer-events: auto;
            min-width: 320px;
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        /* Title glow animation */
        @keyframes titleGlow {
            0%, 100% {
                text-shadow:
                    0 0 10px rgba(233, 69, 96, 0.5),
                    0 0 20px rgba(233, 69, 96, 0.3),
                    0 0 40px rgba(233, 69, 96, 0.15);
            }
            50% {
                text-shadow:
                    0 0 18px rgba(233, 69, 96, 0.8),
                    0 0 35px rgba(233, 69, 96, 0.5),
                    0 0 65px rgba(233, 69, 96, 0.3),
                    0 0 90px rgba(233, 69, 96, 0.12);
            }
        }

        .modal-card h1 {
            font-size: 36px;
            color: #e94560;
            margin-bottom: 8px;
            letter-spacing: 2px;
            animation: titleGlow 2.5s ease-in-out infinite;
        }

        .modal-card .subtitle {
            font-size: 14px;
            color: #8888a0;
            margin-bottom: 28px;
        }

        .modal-card .stats {
            margin-bottom: 24px;
            font-size: 14px;
            color: #b0b0c0;
            line-height: 1.8;
        }

        .modal-card .stats .stat-highlight {
            color: #f0c040;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 12px 36px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:focus-visible {
            outline: 2px solid #f0c040;
            outline-offset: 2px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* === Reward Panel (z-index: inherited from #modal-overlay = 100) === */
        .reward-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            padding: 32px 24px;
            pointer-events: auto;
        }

        .reward-panel-title {
            font-size: 28px;
            color: #f0c040;
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(240, 192, 64, 0.3);
        }

        .reward-cards-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .reward-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 220px;
            min-height: 280px;
            padding: 24px 20px 20px;
            background: rgba(22, 22, 38, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .reward-card:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: rgba(240, 192, 64, 0.6);
            box-shadow: 0 8px 30px rgba(240, 192, 64, 0.15);
        }

        .reward-card:focus-visible {
            outline: 2px solid #f0c040;
            outline-offset: 3px;
        }

        .reward-card-selected {
            border-color: #4ecca3 !important;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.5) !important;
            transform: scale(1.06);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .reward-card-icon {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .reward-card-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .reward-card-type {
            font-size: 12px;
            color: #8888a0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 4px;
        }

        .reward-card-desc {
            font-size: 13px;
            color: #b0b0c0;
            text-align: center;
            line-height: 1.5;
            flex: 1;
        }

        .reward-card-stats {
            font-size: 12px;
            color: #f0c040;
            text-align: center;
            line-height: 1.6;
            background: rgba(240, 192, 64, 0.08);
            padding: 6px 12px;
            border-radius: 8px;
            width: 100%;
        }

        /* Unified level badge — position top-right of card */
        .reward-card-level {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 4px;
            line-height: 1.4;
        }

        /* Lv.1 — white */
        .reward-card-level-1 {
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
        }

        /* Lv.2 — blue */
        .reward-card-level-2 {
            color: #5b9bd5;
            background: rgba(91, 155, 213, 0.12);
            border: 1px solid rgba(91, 155, 213, 0.28);
        }

        /* Lv.3 — purple */
        .reward-card-level-3 {
            color: #b07ce0;
            background: rgba(176, 124, 224, 0.12);
            border: 1px solid rgba(176, 124, 224, 0.28);
        }

        /* Lv.4+ — gold */
        .reward-card-level-4 {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.32);
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.35);
        }

        /* Upgrade indicator text — green, centered below the name */
        .reward-card-upgrade {
            font-size: 12px;
            color: #4ecca3;
            font-weight: bold;
            letter-spacing: 0.5px;
            background: rgba(78, 204, 163, 0.10);
            padding: 2px 10px;
            border-radius: 4px;
        }

        /* Slide-up entrance animation */
        @keyframes rewardSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rewardCardEnter {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        .reward-panel-enter {
            animation: rewardSlideUp 0.4s ease-out both;
        }

        .reward-card-enter {
            opacity: 0;
            animation: rewardCardEnter 0.35s ease-out forwards;
        }

        /* Reduced motion: skip entrance animations */
        @media (prefers-reduced-motion: reduce) {
            .reward-panel-enter {
                animation: none;
            }
            .reward-card-enter {
                opacity: 1;
                animation: none;
            }
            .reward-card {
                transition: none;
            }
        }

        /* === Pause Overlay === */
        #pause-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .pause-card {
            background: rgba(22, 22, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px; padding: 40px 48px; text-align: center;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; align-items: center;
        }

        /* Hidden by default */
        .hidden {
            display: none !important;
        }

        /* Screen containers (main-menu, level-select, shop, loadout, settlement) */
        .screen {
            display: none; opacity: 0; transition: opacity 0.25s ease;
        }

        .screen.active {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: auto; opacity: 1;
        }

        /* === Per-Screen Fullscreen Backgrounds === */
        #main-menu.active {
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                radial-gradient(ellipse at 50% 120%, rgba(233, 69, 96, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, #141a2e 0%, #0a0d18 100%);
        }
        #level-select.active {
            background:
                linear-gradient(rgba(160, 130, 80, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(160, 130, 80, 0.05) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 25%, rgba(200, 155, 60, 0.10) 0%, transparent 65%),
                radial-gradient(ellipse at 50% 50%, #1a160e 0%, #0e0c08 100%);
        }
        #shop-panel.active {
            background:
                radial-gradient(ellipse at 50% -10%, rgba(210, 150, 40, 0.14) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(180, 120, 40, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #1a1410 0%, #0c0a06 100%);
        }
        #loadout-panel.active {
            background:
                repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(100,120,150,0.04) 3px, rgba(100,120,150,0.04) 6px),
                radial-gradient(ellipse at 50% 100%, rgba(100, 140, 180, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #161a24 0%, #0c0e14 100%);
        }
        #settlement-panel.active {
            background:
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(200,160,60,0.03) 60px, rgba(200,160,60,0.03) 61px),
                radial-gradient(ellipse at 50% 70%, rgba(200, 150, 50, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, #181410 0%, #0a0804 100%);
        }

        /* === Responsive === */
        /* Reduced motion: disable cooldown transition animation */
        @media (prefers-reduced-motion: reduce) {
            .skill-cooldown-overlay {
                transition: none;
            }
        }

        /* === Responsive === */
        @media (max-width: 480px) {
            .hud-top {
                font-size: 13px;
                padding: 6px 10px;
                gap: 8px;
            }
            .skill-slot {
                width: 46px;
                height: 46px;
            }
            .skill-slot .skill-icon {
                font-size: 18px;
            }
            .skill-slot .skill-name {
                font-size: 8px;
                max-width: 38px;
            }
            .equipment-panel {
                top: 60px;
                right: 4px;
                min-width: 130px;
                padding: 6px 8px;
                font-size: 11px;
            }
            .equipment-panel-title {
                font-size: 10px;
            }
            .modal-card {
                min-width: auto;
                margin: 0 20px;
                padding: 28px 24px;
            }
            .modal-card h1 {
                font-size: 28px;
            }
        }
        /* === Notification Log (left edge) === */
        #notification-log {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 15;
            pointer-events: none;
            max-width: 280px;
        }
        .notification-entry {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            animation: notif-slide-in 0.3s ease-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.5s ease, transform 0.3s ease;
        }
        .notif-fading {
            opacity: 0;
            transform: translateX(-20px);
        }
        @keyframes notif-slide-in {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .notification-entry { animation: none; }
        }
    </style>
</head>
<body>

    <!-- Canvas layer -->
    <canvas id="game-canvas"></canvas>

    <!-- Ambient particle background -->
    <div id="bg-particles"></div>

    <!-- Damage number layer -->
    <div id="damage-layer"></div>

    <!-- HUD overlay -->
    <div id="hud-overlay">
        <!-- Top HUD -->
        <div class="hud-top">
            <div class="hud-hp">
                <span class="hud-hp-label">HP</span>
                <div class="hud-hp-bar-outer">
                    <div class="hud-hp-bar-inner" id="hp-bar-fill"></div>
                </div>
                <span id="hp-text" style="font-size:13px;white-space:nowrap;">100/100</span>
            </div>
            <span class="hud-divider"></span>
            <div class="hud-stat">
                <span class="icon">&#x1FA99;</span>
                <span class="value" id="gold-value">0</span>
            </div>
            <span class="hud-divider"></span>
            <div class="hud-stat">
                <span class="icon">&#x2694;</span>
                <span class="value" id="wave-value">1</span>
            </div>
            <span class="hud-divider"></span>
            <div class="hud-stat">
                <span>&#x23F1;</span>
                <span class="value" id="time-value">0:00</span>
            </div>
            <span class="hud-divider"></span>
            <button id="btn-pause" class="hud-pause-btn" title="暂停">&#x23F8;</button>
        </div>

        <!-- Skill bar -->
        <div class="skill-bar">
            <div class="skill-slot skill-slot-empty" data-key="1" tabindex="0" role="button" aria-label="空技能槽">
                <div class="skill-cooldown-overlay"></div>
                <span class="key-hint">1</span>
            </div>
            <div class="skill-slot skill-slot-empty" data-key="2" tabindex="0" role="button" aria-label="空技能槽">
                <div class="skill-cooldown-overlay"></div>
                <span class="key-hint">2</span>
            </div>
            <div class="skill-slot skill-slot-empty" data-key="3" tabindex="0" role="button" aria-label="空技能槽">
                <div class="skill-cooldown-overlay"></div>
                <span class="key-hint">3</span>
            </div>
            <div class="skill-slot skill-slot-empty" data-key="4" tabindex="0" role="button" aria-label="空技能槽">
                <div class="skill-cooldown-overlay"></div>
                <span class="key-hint">4</span>
            </div>
        </div>

        <!-- Equipment panel -->
        <div class="equipment-panel" id="equipment-panel">
            <div class="equipment-panel-title">装备</div>
        </div>
    </div>

    <!-- Pause overlay -->
    <div id="pause-overlay" class="hidden">
        <div class="pause-card">
            <h2 style="color:#f0c040;font-size:28px;letter-spacing:3px;margin-bottom:24px;">游戏暂停</h2>
            <button id="btn-pause-resume" class="btn" style="width:240px;margin-bottom:12px;">继续游戏</button>
            <button id="btn-pause-quit" class="btn btn-secondary" style="width:240px;">退出</button>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen"></div>

    <!-- Level Select -->
    <div id="level-select" class="screen"></div>

    <!-- Shop Panel -->
    <div id="shop-panel" class="screen"></div>

    <!-- Loadout Panel -->
    <div id="loadout-panel" class="screen"></div>

    <!-- Settlement Panel -->
    <div id="settlement-panel" class="screen"></div>

    <!-- Modal overlay -->
    <div id="modal-overlay">
        <!-- Start screen -->
        <div class="modal-card" id="start-screen">
            <h1>Click Rouge</h1>
            <p class="subtitle">点击肉鸽</p>
            <button class="btn" id="btn-start">开始游戏</button>
        </div>

        <!-- Game over screen (hidden by default) -->
        <div class="modal-card hidden" id="gameover-screen">
            <h1>游戏结束</h1>
            <div class="stats">
                <p>存活时间：<span class="stat-highlight" id="stat-time">0:00</span></p>
                <p>到达波次：<span class="stat-highlight" id="stat-wave">1</span></p>
                <p>击杀数量：<span class="stat-highlight" id="stat-kills">0</span></p>
                <p>获得金币：<span class="stat-highlight" id="stat-gold">0</span></p>
            </div>
            <button class="btn" id="btn-restart">重新开始</button>
        </div>
    </div>

    <!-- Main game module -->
    <script type="module" src="src/main.js"></script>
<script>
// Ambient particle background — subtle floating dots
(function() {
    const container = document.getElementById('bg-particles');
    if (!container) return;
    for (let i = 0; i < 30; i++) {
        const dot = document.createElement('div');
        dot.className = 'bg-particle';
        const size = Math.random() * 3 + 1;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = Math.random() * 100 + '%';
        dot.style.background = Math.random() > 0.5
            ? 'rgba(240, 192, 64, 0.5)'
            : 'rgba(78, 204, 163, 0.4)';
        dot.style.animationDuration = (Math.random() * 12 + 8) + 's';
        dot.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(dot);
    }
})();
</script>
</body>
</html>
