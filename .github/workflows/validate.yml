name: Validate JS Project

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './.claude/*' | while read file; do
            node --check "$file" || exit 1
          done
          echo "All JS files pass syntax check."
